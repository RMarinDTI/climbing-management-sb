services:

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    # it will build climbing-management-sb-app:latest when "docker compose up -d"
    # when we build it manually, we set the tag "docker build -t climbing-management-sb:2.0 ."
    build: .

    ports:
      - "${APP_PORT}:8080"

    # Docker mounts the container's root filesystem as read-only
    read_only: true

    # Explicitly give /tmp writable space:
    tmpfs:
      - /tmp

    environment:
      SPRING_PROFILES_ACTIVE: docker
      MONGO_DB: ${MONGO_DB}
     #   ↑           ↑
     # container    .env / Compose
     # variable

    depends_on:
      postgres:
        condition: service_healthy
      mongo:
     #  condition: service_started
        condition: service_healthy

volumes:
  postgres-data:
  mongo-data:
  mongo-config: