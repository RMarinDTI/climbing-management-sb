
#### APPLICATION

spring.application.name=climbing-management-sb

# Tells Hibernate how to manage the database schema.
# update creates missing tables and updates the schema when
# entity changes are detected without deleting existing data.
# update      -> development / learning
# validate    -> production (checks schema without modifying it)
# create      -> recreates tables when the application starts
# create-drop -> creates tables at startup and removes them at shutdown
spring.jpa.hibernate.ddl-auto=update

# Show SQL generated by Hibernate.
spring.jpa.show-sql=true

# Enables automatic creation of MongoDB indexes defined with Spring Data annotations such as @Indexed and @CompoundIndex.
# Without this setting, indexes declared in the Java entities may not be created automatically in MongoDB.
spring.data.mongodb.auto-index-creation=true



# logging.level.org.springframework.boot.context.config=DEBUG
# debug=true

