# Temporary diagnostic manifest used during Kubernetes troubleshooting.
# Not part of the normal application deployment.

apiVersion: v1
kind: Pod

metadata:
  name: secret-debug

spec:
  automountServiceAccountToken: false

  containers:
    - name: debug
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "SECRET_FILE:"
          cat /run/secrets/spring.datasource.password
          sleep 3600

      volumeMounts:
        - name: app-secret
          mountPath: /run/secrets
          readOnly: true

  volumes:
    - name: app-secret
      secret:
        secretName: climbing-management-secret
        items:
          - key: DB_PASSWORD
            path: spring.datasource.password