apiVersion: v1
kind: Pod

metadata:
  name: secret-test

spec:
  containers:
    - name: secret-test
      image: alpine:latest

      # Inject one specific value from the Kubernetes Secret
      # as an environment variable.
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: climbing-management-secret
              key: DB_PASSWORD

      command:
        - sh
        - -c
        - |
          # Verify that the Secret was injected without exposing its value.
          echo "DB_PASSWORD is configured: ${DB_PASSWORD:+YES}"


# Secret
#    │
#    │ secretKeyRef
#    ▼
#   Pod
#    │
#    ▼
# DB_PASSWORD environment variable
#    │
#    ▼
# Application