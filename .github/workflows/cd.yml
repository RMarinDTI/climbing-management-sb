name: CD

on:
  workflow_run:
    # Run the CD workflow when the CI workflow finishes.
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - # Deployment simulation
      - name: Deploy Docker image
        # head_sha identifies the exact commit that triggered that CI run.
        run: |
          echo "Deploying image:"
          echo "ghcr.io/rmarintech/climbing-management-sb:${{ github.event.workflow_run.head_sha }}"